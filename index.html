<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>دفتر پرداخت‌ها</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f6e56">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
<style>
:root {
  --bg: #f0f2f0;
  --fg: #1a1c1a;
  --mut: #6b6f6b;
  --card: #ffffff;
  --line: #e2e6e2;
  --ac: #0d7a5f;
  --ac2: #0a5c47;
  --acs: #e6f5f0;
  --red: #c62828;
  --orange: #e65100;
  --blue: #1565c0;
  --sh: 0 2px 8px rgba(0,0,0,.06);
  --radius: 16px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f10; --fg: #eef0ee; --mut: #9aa09a;
    --card: #1a1c1e; --line: #2a2d30; --ac: #2dd4a8;
    --ac2: #1a9e7a; --acs: #142e27; --red: #f07167;
    --orange: #ff9e40; --blue: #64b5f6; --sh: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f10; --fg: #eef0ee; --mut: #9aa09a;
  --card: #1a1c1e; --line: #2a2d30; --ac: #2dd4a8;
  --ac2: #1a9e7a; --acs: #142e27; --red: #f07167;
  --orange: #ff9e40; --blue: #64b5f6; --sh: none;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-padding-top: calc(var(--safe-top) + 8px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: Vazirmatn, Tahoma, sans-serif;
  padding: 12px 14px calc(140px + var(--safe-bot));
  max-width: 920px;
  margin-inline: auto;
  line-height: 1.5;
  min-height: 100dvh;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
  padding-top: var(--safe-top);
}
.header h1 {
  font-size: 1.35rem;
  font-weight: 700;
  margin: 0 0 2px;
  letter-spacing: -0.02em;
}
.header .sub {
  color: var(--mut);
  font-size: 0.78rem;
}
.icon-btn {
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--mut);
  width: 40px;
  height: 40px;
  border-radius: 12px;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
.icon-btn:active { background: var(--acs); }

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.st {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 8px;
  text-align: center;
  box-shadow: var(--sh);
}
.st span {
  display: block;
  color: var(--mut);
  font-size: 0.7rem;
  margin-bottom: 2px;
}
.st b {
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.st.highlight {
  background: var(--acs);
  border-color: transparent;
}
.st.highlight b { color: var(--ac); }

/* Filters */
.filters {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.filters input, .filters select {
  font: inherit;
  color: var(--fg);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 0.85rem;
  outline: none;
  min-width: 0;
}
.filters input:focus, .filters select:focus { border-color: var(--ac); }
.filters .search {
  flex: 1;
  min-width: 140px;
}
.chip {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 0.8rem;
  cursor: pointer;
  color: var(--mut);
  white-space: nowrap;
}
.chip.active {
  background: var(--acs);
  border-color: var(--ac);
  color: var(--ac);
  font-weight: 600;
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--sh);
}
.card-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 0.85rem;
  color: var(--mut);
  font-weight: 500;
}
.view-toggle {
  display: flex;
  gap: 4px;
  background: var(--bg);
  padding: 3px;
  border-radius: 10px;
}
.view-toggle button {
  background: transparent;
  border: none;
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 0.8rem;
  color: var(--mut);
  cursor: pointer;
  font-family: inherit;
}
.view-toggle button.active {
  background: var(--card);
  color: var(--fg);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}

/* Chart */
.chart-bars {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.82rem;
}
.bar-label {
  width: 90px;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
}
.bar-track {
  flex: 1;
  height: 10px;
  background: var(--bg);
  border-radius: 5px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--ac), var(--ac2));
  border-radius: 5px;
  transition: width 0.5s ease;
}
.bar-val {
  width: 70px;
  text-align: left;
  direction: ltr;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: 0.78rem;
  color: var(--mut);
}

/* Table */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th {
  color: var(--mut);
  font-weight: 500;
  font-size: 0.75rem;
  text-align: right;
  padding: 8px 6px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
td {
  padding: 10px 6px;
  border-bottom: 1px solid var(--line);
  text-align: right;
  vertical-align: middle;
}
td.n {
  direction: ltr;
  text-align: left;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
td.d { color: var(--mut); white-space: nowrap; font-size: 0.82rem; }
td.a { width: 1%; white-space: nowrap; text-align: left; }
.g1 td {
  background: var(--acs);
  cursor: pointer;
  padding: 12px 10px;
  font-weight: 700;
  border-bottom: 0;
  border-radius: 10px 10px 0 0;
}
.g2 td {
  background: var(--bg);
  cursor: pointer;
  padding: 9px 10px;
  color: var(--fg);
}
.g2 b { font-weight: 500; margin-inline-start: 12px; }
.cnt { color: var(--mut); font-size: 0.75rem; font-weight: 400; margin-inline-start: 6px; }
.tt {
  float: left;
  direction: ltr;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.g1 .tt { color: var(--ac); }
.chev { color: var(--mut); display: inline-block; width: 14px; font-size: 0.85rem; }

/* Empty */
.empty {
  color: var(--mut);
  text-align: center;
  padding: 32px 10px;
  font-size: 0.9rem;
}
.empty-icon { font-size: 2.2rem; margin-bottom: 8px; opacity: 0.6; }

/* Payer summary */
.pr {
  display: flex;
  justify-content: space-between;
  padding: 9px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 0.9rem;
}
.pr:last-child { border: 0; }
.pr b { direction: ltr; font-variant-numeric: tabular-nums; }

/* Bottom bar */
#bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: var(--card);
  border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + var(--safe-bot));
  z-index: 50;
  box-shadow: 0 -4px 20px rgba(0,0,0,.06);
}
#bar .in { max-width: 920px; margin: auto; }
#hint {
  color: var(--mut);
  font-size: 0.78rem;
  margin-bottom: 8px;
  min-height: 18px;
  transition: color 0.2s;
}
#hint.ok { color: var(--ac); }
#hint.err { color: var(--red); }
.bar-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
#mic {
  width: 48px; height: 48px;
  border-radius: 50%;
  padding: 0;
  font-size: 1.3rem;
  flex: none;
  background: var(--ac);
  color: #fff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s, background 0.2s;
}
#mic.on {
  background: var(--red);
  animation: pulse 1s infinite;
}
#mic:active { transform: scale(0.92); }
@keyframes pulse { 50% { opacity: 0.7; } }
#txt {
  flex: 1;
  min-width: 0;
  font: inherit;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  outline: none;
  font-size: 16px;
}
#txt:focus { border-color: var(--ac); }
#add {
  background: var(--ac);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
#add:active { background: var(--ac2); }

/* Menus */
#gmenu, #menu {
  position: fixed;
  display: none;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,.15);
  min-width: 170px;
  padding: 6px;
  z-index: 60;
}
#gmenu {
  top: calc(var(--safe-top) + 56px);
  left: 14px;
}
#gmenu button, #menu button {
  display: block;
  width: 100%;
  text-align: right;
  background: transparent;
  color: var(--fg);
  padding: 11px 14px;
  border-radius: 10px;
  border: none;
  font: inherit;
  font-size: 0.9rem;
  cursor: pointer;
}
#gmenu button:active, #menu button:active { background: var(--bg); }
#gmenu button.del, #menu button.del { color: var(--red); }

/* Dialog */
#dlg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  backdrop-filter: blur(4px);
}
.dbox {
  background: var(--card);
  border-radius: 18px;
  padding: 22px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 20px 50px rgba(0,0,0,.2);
}
#dm { margin-bottom: 14px; font-size: 0.95rem; line-height: 1.5; }
#dtx {
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 14px;
  font: inherit;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  display: none;
  resize: vertical;
}
.dbox .row { display: flex; gap: 10px; }
.dbox button {
  flex: 1;
  font: inherit;
  font-weight: 600;
  border: 0;
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
}
.dbox button.primary { background: var(--ac); color: #fff; }
.dbox button.ghost {
  background: transparent;
  color: var(--fg);
  border: 1px solid var(--line);
}

/* Edit form */
.ef {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}
.ef label {
  font-size: 0.75rem;
  color: var(--mut);
  display: block;
  margin-bottom: 3px;
}
.ef input {
  width: 100%;
  font: inherit;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 11px;
  outline: none;
}
.ef input:focus { border-color: var(--ac); }
.ef .w { grid-column: 1 / -1; }
.ef-actions {
  display: flex;
  gap: 8px;
  margin-top: 6px;
}
.ef-actions button {
  flex: 1;
  font: inherit;
  font-weight: 600;
  border: 0;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
}
.ef-actions .save { background: var(--ac); color: #fff; }
.ef-actions .cancel {
  background: transparent;
  color: var(--fg);
  border: 1px solid var(--line);
}

/* Toast */
.toast {
  position: fixed;
  top: calc(var(--safe-top) + 16px);
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: #1a1c1a;
  color: #fff;
  padding: 10px 20px;
  border-radius: 12px;
  font-size: 0.85rem;
  z-index: 200;
  opacity: 0;
  transition: all 0.3s cubic-bezier(.2,.8,.2,1);
  pointer-events: none;
  max-width: 90%;
  text-align: center;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .toast { background: #eef0ee; color: #1a1c1a; }
}


/* Latest entry highlight */
.latest-card {
  background: linear-gradient(135deg, var(--acs), var(--card));
  border: 1px solid var(--ac);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--sh);
}
.latest-card .label {
  font-size: 0.75rem;
  color: var(--ac);
  font-weight: 600;
  margin-bottom: 6px;
}
.latest-card .amount {
  font-size: 1.35rem;
  font-weight: 700;
  direction: ltr;
  text-align: left;
  font-variant-numeric: tabular-nums;
  color: var(--fg);
}
.latest-card .meta {
  font-size: 0.85rem;
  color: var(--mut);
  margin-top: 4px;
}
.latest-empty {
  color: var(--mut);
  font-size: 0.9rem;
  text-align: center;
  padding: 12px;
}

/* Data page toggle */
.data-section { display: none; }
.data-section.show { display: block; }
.main-summary.show { display: block; }
#btnShowData, #btnBackMain {
  width: 100%;
  margin-bottom: 12px;
  padding: 12px;
  border-radius: 12px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  border: none;
}
#btnShowData {
  background: var(--ac);
  color: #fff;
}
#btnBackMain {
  background: var(--card);
  color: var(--fg);
  border: 1px solid var(--line);
}

/* Offline / progress */
.progress-wrap {
  display: none;
  margin: 8px 0 4px;
  background: var(--bg);
  border-radius: 8px;
  height: 8px;
  overflow: hidden;
}
.progress-wrap.show { display: block; }
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--ac), var(--ac2));
  width: 0%;
  transition: width 0.3s;
  border-radius: 8px;
}
.status-badge {
  display: inline-block;
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 10px;
  margin-right: 6px;
  vertical-align: middle;
}
.status-badge.online { background: #e3f2ed; color: #0d7a5f; }
.status-badge.offline-ready { background: #e8f5e9; color: #2e7d32; }
.status-badge.offline-need { background: #fff3e0; color: #e65100; }
.status-badge.downloading { background: #e3f2fd; color: #1565c0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .status-badge.online { background: #142e27; color: #2dd4a8; }
  :root:not([data-theme="light"]) .status-badge.offline-ready { background: #1b3a1f; color: #81c784; }
  :root:not([data-theme="light"]) .status-badge.offline-need { background: #3e2723; color: #ffb74d; }
  :root:not([data-theme="light"]) .status-badge.downloading { background: #0d2137; color: #64b5f6; }
}

/* Responsive */
@media (max-width: 480px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .bar-label { width: 70px; font-size: 0.75rem; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>دفتر پرداخت‌ها</h1>
    <div class="sub">ثبت صوتی · دسته‌بندی هوشمند · نسخه ۲ <span class="status-badge" id="speechStatus">—</span></div>
  </div>
  <button class="icon-btn" id="gm" aria-label="گزینه‌ها">⋮</button>
</div>

<div id="gmenu">
  <button id="themeBtn">تغییر تم روشن/تاریک</button>
  <button id="offlineBtn">دانلود مدل تشخیص آفلاین (~۴۹ مگ)</button>
  <button id="copy">کپی برای اکسل</button>
  <button id="bk">پشتیبان (کپی)</button>
  <button id="rs">بازیابی پشتیبان</button>
  <button id="clr" class="del">پاک کردن همه</button>
</div>

<!-- Stats -->
<div class="stats">
  <div class="st"><span>امروز</span><b id="sT">۰</b></div>
  <div class="st"><span>این هفته</span><b id="sW">۰</b></div>
  <div class="st"><span>این ماه</span><b id="sM">۰</b></div>
  <div class="st highlight"><span>جمع کل</span><b id="sA">۰</b></div>
</div>

<!-- Latest entry -->
<div class="latest-card" id="latestCard">
  <div class="label">آخرین ثبت</div>
  <div id="latestContent" class="latest-empty">هنوز چیزی ثبت نشده</div>
</div>

<button id="btnShowData">مشاهده همه داده‌ها ←</button>

<div class="data-section" id="dataSection">
<button id="btnBackMain">→ بازگشت به صفحه اصلی</button>
<div class="filters">
  <button class="chip active" data-range="all">همه</button>
  <button class="chip" data-range="today">امروز</button>
  <button class="chip" data-range="week">این هفته</button>
  <button class="chip" data-range="month">این ماه</button>
  <input class="search" id="search" type="search" placeholder="جستجو در شرح یا دسته...">
</div>

<!-- Chart -->
<div class="card" id="chartCard">
  <div class="card-title">
    <span>بیشترین هزینه‌ها (به تفکیک شاخه)</span>
  </div>
  <div class="chart-bars" id="chart"></div>
</div>

<!-- Main list -->
<div class="card">
  <div class="card-title">
    <span>پرداخت‌ها</span>
    <div class="view-toggle">
      <button id="vT" class="active">جدول</button>
      <button id="vG">درختی</button>
    </div>
  </div>
  <div class="scroll">
    <table>
      <thead id="th"></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="empty" class="empty" style="display:none">
    <div class="empty-icon">📋</div>
    هنوز پرداختی ثبت نشده.<br>
    <span style="font-size:0.8rem">با میکروفون یا تایپ شروع کن.</span>
  </div>
</div>

<!-- Payer summary -->
<div class="card">
  <div class="card-title"><span>جمع به تفکیک پرداخت‌کننده</span></div>
  <div id="pay"></div>
</div>

</div><!-- end dataSection -->

<!-- Dialog -->
<div id="dlg">
  <div class="dbox">
    <div id="dm"></div>
    <textarea id="dtx" rows="4"></textarea>
    <div class="row">
      <button class="primary" id="dok">تأیید</button>
      <button class="ghost" id="dno">لغو</button>
    </div>
  </div>
</div>

<!-- Context menu -->
<div id="menu">
  <button id="mEdit">✎ ویرایش</button>
  <button id="mDel" class="del">🗑 حذف</button>
</div>

<!-- Bottom bar -->
<div id="bar">
  <div class="in">
    <div id="hint">بگو: «دستمزد گچکار ۲۰۰ هزار تومان پرداخت شده توسط مهدی»</div>
    <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="bar-row">
      <button id="mic" title="ضبط صدا">🎤</button>
      <input id="txt" placeholder="پرداخت را بگو یا تایپ کن..." autocomplete="off">
      <button id="add">ثبت</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = "pardakht-v2";
let S = { entries: [], map: {}, view: "table", theme: "" };
try {
  const r = localStorage.getItem(KEY) || localStorage.getItem("pardakht-v1");
  if (r) {
    const old = JSON.parse(r);
    S.entries = old.entries || [];
    S.map = old.map || {};
    S.view = old.view || "table";
    S.theme = old.theme || "";
  }
} catch (e) {}
S.entries = S.entries || [];
S.map = S.map || {};
S.entries.forEach(e => { if (!e.sub) e.sub = "عمومی"; });

const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
};

const $ = id => document.getElementById(id);
const fa = n => Number(n).toLocaleString("fa-IR");
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const today = () => iso(new Date());
const shift = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const dd = d => new Date(d + "T12:00:00");
const pdate = d => dd(d).toLocaleDateString("fa-IR-u-ca-persian");
const mk = d => new Intl.DateTimeFormat("en-u-ca-persian", { year: "numeric", month: "numeric" })
  .formatToParts(dd(d)).filter(p => p.type !== "literal").map(p => p.value).join("-");
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

let editId = null, menuId = null, collapsed = {}, view = S.view || "table";
let rangeFilter = "all", searchQ = "";

// Theme
if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
$("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  S.theme = next;
  save();
};

// Number words
const W = { صفر:0,یک:1,دو:2,سه:3,چهار:4,پنج:5,شش:6,شیش:6,هفت:7,هشت:8,نه:9,ده:10,یازده:11,دوازده:12,سیزده:13,چهارده:14,پانزده:15,شانزده:16,هفده:17,هجده:18,نوزده:19,بیست:20,سی:30,چهل:40,پنجاه:50,شصت:60,هفتاد:70,هشتاد:80,نود:90,صد:100,یکصد:100,دویست:200,سیصد:300,چهارصد:400,پانصد:500,ششصد:600,هفتصد:700,هشتصد:800,نهصد:900 };
const M = { هزار:1e3, میلیون:1e6, ملیون:1e6, میلیارد:1e9 };

function norm(s) {
  return s.replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/ي/g, "ی").replace(/ك/g, "ک")
    .replace(/(\d)[,،٬](?=\d)/g, "$1").replace(/\u200c/g, " ");
}
const isNum = t => /^\d+(\.\d+)?$/.test(t) || t in W || t in M;

function parse(raw) {
  let t = norm(raw).trim().split(/\s+/), best = null;
  for (let i = 0; i < t.length; i++) {
    if (!isNum(t[i])) continue;
    let j = i;
    while (j + 1 < t.length && (isNum(t[j + 1]) || (t[j + 1] === "و" && j + 2 < t.length && isNum(t[j + 2])))) j++;
    if (!best || j - i > best[1] - best[0]) best = [i, j];
    i = j;
  }
  if (!best) return null;
  let total = 0, cur = 0;
  for (let k = best[0]; k <= best[1]; k++) {
    const w = t[k];
    if (w === "و") continue;
    if (/^\d/.test(w)) cur += parseFloat(w);
    else if (w in W) cur += W[w];
    else { total += (cur || 1) * M[w]; cur = 0; }
  }
  let amt = total + cur;
  let rest = t.slice(0, best[0]).concat(t.slice(best[1] + 1));
  if (/ریال/.test(rest.join(" "))) amt = Math.round(amt / 10);
  const stop = new Set(["تومان","تومن","ریال","پرداختی","پرداخت","امروز","مبلغ","برای","بابت","به","مقدار","و","را","خرید","خریدم","خریدیم","واریز","واریزی","حساب","رو","من"]);
  const desc = rest.filter(w => !stop.has(w)).join(" ").trim();
  return { amt, desc: desc || "بدون شرح" };
}

// Spelling correction
const BASE = ["آرماتوربند","آهن‌آلات","میلگرد","تیرآهن","سیمان","بتن","ماسه","آجر","بلوک","کاشی","سرامیک","موزاییک","سنگ","رنگ","نقاش","نجار","جوشکار","کارگر","لوله‌کشی","برق‌کشی","سیم‌کشی","قالب‌بندی","عایق","پنجره","اجاره","اسکلت","فنداسیون","گچ‌کاری","نازک‌کاری","مصالح","بنایی","حمل","کرایه","خرطومی","کابل","اتصالات","گچکار","برقکار","کاشیکار","سنگکار","آهنگر","لوله‌کش","دستمزد","پریز","کلید","فیوز","شیرآلات","آبگرمکن"];
const key = s => norm(s).replace(/[آأإ]/g, "ا").replace(/[\s\u200c]/g, "").replace(/ة/g, "ه").replace(/[\u064B-\u0652]/g, "");
function lev(a, b) {
  const p = []; for (let j = 0; j <= b.length; j++) p[j] = j;
  for (let i = 1; i <= a.length; i++) {
    let prev = p[0]; p[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const t = p[j];
      p[j] = Math.min(p[j] + 1, p[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = t;
    }
  }
  return p[b.length];
}
function fixPhrase(desc) {
  const V = new Set(BASE);
  Object.keys(P).forEach(p => V.add(p));
  S.entries.forEach(e => { V.add(e.cat); V.add(e.sub); e.sub.split(" ").forEach(w => w && V.add(w)); });
  const vs = [...V].map(v => [v, key(v)]), ws = desc.split(" "), out = [], notes = [];
  for (let i = 0; i < ws.length; i++) {
    let done = false;
    for (const n of [2, 1]) {
      if (i + n > ws.length) continue;
      const raw = ws.slice(i, i + n).join(" "), k = key(raw);
      if (k.length < 4) continue;
      let best = null, bd = 9;
      for (const [v, kv] of vs) { const d = lev(k, kv); if (d < bd) { bd = d; best = v; } }
      if (best && bd <= (k.length >= 7 ? 2 : 1)) {
        if (best !== raw) notes.push(raw + " ← " + best);
        out.push(best); i += n - 1; done = true; break;
      }
    }
    if (!done) out.push(ws[i]);
  }
  return { text: out.join(" "), notes };
}

// Classification
const P = {
  "برق": ["کابل","سیم","کلید","پریز","فیوز","لامپ","تابلو","کنتور","خرطومی","برق‌کشی","سیم‌کشی"],
  "لوله‌کشی": ["لوله","اتصالات","شیر","شیرآلات","آبگرمکن","پمپ","فاضلاب","مخزن","زانو","سه‌راهی"],
  "دستمزد": ["دستمزد","اجرت","مزد","حقوق","کارگر","استادکار"],
  "مصالح": ["سیمان","شن","ماسه","آجر","بلوک","گچ","بتن","خاک","آهک"],
  "آهن‌آلات": ["آهن","آهن‌آلات","میلگرد","تیرآهن","ورق","نبشی","قوطی","تیرچه"],
  "نقاشی": ["رنگ","نقاش","پوتی","کاغذدیواری","رنگ‌آمیزی"],
  "کاشی و سرامیک": ["کاشی","سرامیک","موزاییک","سنگ"],
  "درب و پنجره": ["درب","پنجره","نرده","شیشه"],
  "حمل و نقل": ["حمل","کرایه","نیسان","کامیون","جرثقیل","باربری"],
  "ابزار": ["ابزار","دریل","پیچ","میخ","بیل","کلنگ"]
};
function classify(desc) {
  const ws = desc.split(" ").filter(Boolean);
  const names = new Set(Object.keys(P));
  S.entries.forEach(e => names.add(e.cat));
  const nk = [...names].map(n => [n, key(n)]);
  let parent = null, nameTok = -1;
  ws.forEach((w, i) => { const h = nk.find(x => x[1] === key(w)); if (h && !parent) { parent = h[0]; nameTok = i; } });
  if (!parent) {
    for (const w of ws) {
      const k = key(w);
      if (S.map[k]) { parent = S.map[k]; break; }
      const p = Object.keys(P).find(p => P[p].some(x => key(x) === k));
      if (p) { parent = p; break; }
    }
  }
  parent = parent || "متفرقه";
  let sub = ws.filter((w, i) => i !== nameTok).join(" ").trim() || "عمومی";
  const ex = S.entries.find(e => e.cat === parent && key(e.sub) === key(sub));
  if (ex) sub = ex.sub;
  return { parent, sub };
}
function learn(parent, sub) {
  sub.split(" ").forEach(w => {
    const k = key(w);
    if (k.length >= 3 && key(parent) !== k) S.map[k] = parent;
  });
}

function handle(text) {
  let date = today();
  if (/پریروز/.test(text)) { date = shift(-2); text = text.replace(/پریروز/g, " "); }
  else if (/دیروز/.test(text)) { date = shift(-1); text = text.replace(/دیروز/g, " "); }
  let payer = "";
  const tk = norm(text).split(/\s+/);
  const ix = tk.findIndex((w, i) => (w === "کننده" && /^پرداخت/.test(tk[i - 1] || "")) || w === "توسط");
  let st = ix > 0 && tk[ix] === "کننده" ? ix - 1 : ix;
  while (st > 0 && /^(شده|پرداخت|پرداختی)$/.test(tk[st - 1])) st--;
  if (ix >= 0) {
    const known = new Set(BASE.map(key));
    Object.keys(P).forEach(p => { known.add(key(p)); P[p].forEach(x => known.add(key(x))); });
    S.entries.forEach(e => { known.add(key(e.cat)); e.sub.split(" ").forEach(w => known.add(key(w))); });
    let j = ix + 1;
    if (j < tk.length && !isNum(tk[j])) {
      j++;
      if (j < tk.length && !isNum(tk[j]) && !known.has(key(tk[j]))) j++;
    }
    const nm = tk.slice(ix + 1, j).join(" ");
    if (nm) payer = nm;
    tk.splice(st, j - st);
    text = tk.join(" ");
  }
  const p = parse(text);
  if (!p || !p.amt) {
    setHint("مبلغ را تشخیص ندادم: «" + text + "»", "err");
    return;
  }
  const fx = fixPhrase(p.desc), desc = fx.text, c = classify(desc);
  learn(c.parent, c.sub);
  S.entries.unshift({ id: Date.now() + Math.random(), date, cat: c.parent, sub: c.sub, desc, amt: p.amt, payer });
  save();
  render();
  let msg = "✓ ثبت شد: " + c.parent + " ◂ " + c.sub + " — " + fa(p.amt) + " تومان";
  if (payer) msg += " | " + payer;
  if (fx.notes.length) msg += " | اصلاح: " + fx.notes.join("، ");
  setHint(msg, "ok");
  showToast("ثبت شد ✓");
}

function setHint(t, type) {
  const h = $("hint");
  h.textContent = t;
  h.className = type || "";
}

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function getFiltered() {
  let list = S.entries.slice();
  const t = today();
  const weekStart = shift(-((new Date().getDay() + 1) % 7));
  if (rangeFilter === "today") list = list.filter(e => e.date === t);
  else if (rangeFilter === "week") list = list.filter(e => e.date >= weekStart);
  else if (rangeFilter === "month") {
    const m = mk(t);
    list = list.filter(e => mk(e.date) === m);
  }
  if (searchQ) {
    const q = key(searchQ);
    list = list.filter(e => key(e.desc).includes(q) || key(e.cat).includes(q) || key(e.sub).includes(q) || key(e.payer || "").includes(q));
  }
  return list;
}

function renderChart(list) {
  const totals = {};
  list.forEach(e => { totals[e.cat] = (totals[e.cat] || 0) + e.amt; });
  const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const max = sorted[0] ? sorted[0][1] : 1;
  const el = $("chart");
  if (!sorted.length) {
    el.innerHTML = '<div class="empty" style="padding:16px">داده‌ای برای نمودار نیست</div>';
    return;
  }
  el.innerHTML = sorted.map(([name, val]) => `
    <div class="bar-row">
      <div class="bar-label">${esc(name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4, (val / max) * 100)}%"></div></div>
      <div class="bar-val">${fa(val)}</div>
    </div>
  `).join("");
}

function renderLatest() {
  const el = $("latestContent");
  if (!S.entries.length) {
    el.innerHTML = '<div class="latest-empty">هنوز چیزی ثبت نشده</div>';
    el.className = "latest-empty";
    return;
  }
  const e = S.entries[0]; // newest first (we unshift)
  el.className = "";
  el.innerHTML = `
    <div class="amount">${fa(e.amt)} تومان</div>
    <div class="meta">${esc(e.cat)} ◂ ${esc(e.sub)} · ${pdate(e.date)}${e.payer ? " · " + esc(e.payer) : ""}</div>
    <div class="meta" style="margin-top:2px">${esc(e.desc)}</div>
  `;
}

function render() {
  renderLatest();
  const list = getFiltered();
  const rows = $("rows");
  rows.innerHTML = "";
  $("empty").style.display = list.length ? "none" : "block";

  // Chart
  renderChart(list);

  const G = {};
  if (view === "table") {
    G[""] = { "": list.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id) };
  } else {
    list.forEach(e => {
      const g = G[e.cat] = G[e.cat] || {};
      (g[e.sub] = g[e.sub] || []).push(e);
    });
  }

  $("th").innerHTML = view === "table"
    ? "<tr><th>تاریخ</th><th>شاخه</th><th>زیرشاخه</th><th>مبلغ</th><th>پرداخت‌کننده</th><th></th></tr>"
    : "";

  const sum = l => l.reduce((s, e) => s + e.amt, 0);
  const ptot = {};
  Object.keys(G).forEach(p => ptot[p] = sum(Object.values(G[p]).flat()));

  Object.keys(G).sort((a, b) => ptot[b] - ptot[a]).forEach(p => {
    const n = Object.values(G[p]).flat().length;
    const h = document.createElement("tr");
    h.className = "g1";
    h.innerHTML = `<td colspan="6"><span class="chev">${collapsed[p] ? "◂" : "▾"}</span>${esc(p)}<span class="cnt">${fa(n)} پرداخت</span><span class="tt">${fa(ptot[p])}</span></td>`;
    h.onclick = () => { collapsed[p] = !collapsed[p]; render(); };
    if (view !== "table") rows.appendChild(h);
    if (view !== "table" && collapsed[p]) return;

    Object.keys(G[p]).forEach(s => {
      const lst = G[p][s].slice().sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
      const ck = p + "|" + s;
      const h2 = document.createElement("tr");
      h2.className = "g2";
      h2.innerHTML = `<td colspan="6"><span class="chev">${collapsed[ck] ? "◂" : "▾"}</span><b>${esc(s)}</b><span class="cnt">${fa(lst.length)}</span><span class="tt">${fa(sum(lst))}</span></td>`;
      h2.onclick = () => { collapsed[ck] = !collapsed[ck]; render(); };
      if (view !== "table") rows.appendChild(h2);
      if (view !== "table" && collapsed[ck]) return;

      lst.forEach(e => {
        const tr = document.createElement("tr");
        if (editId === e.id) {
          tr.innerHTML = `<td colspan="6"><div class="ef">
            <div><label>تاریخ</label><input type="date" value="${e.date}" data-f="date"></div>
            <div><label>مبلغ (تومان)</label><input inputmode="numeric" value="${e.amt}" data-f="amt"></div>
            <div><label>شاخه</label><input value="${esc(e.cat)}" data-f="cat"></div>
            <div><label>زیرشاخه</label><input value="${esc(e.sub)}" data-f="sub"></div>
            <div class="w"><label>شرح</label><input value="${esc(e.desc)}" data-f="desc"></div>
            <div class="w"><label>پرداخت‌کننده</label><input value="${esc(e.payer || "")}" data-f="payer"></div>
          </div>
          <div class="ef-actions">
            <button class="save" data-act="save">ذخیره</button>
            <button class="cancel" data-act="cancel">انصراف</button>
          </div></td>`;
          tr.querySelector('[data-act="save"]').onclick = () => {
            e.date = tr.querySelector('[data-f="date"]').value;
            e.amt = parseFloat(tr.querySelector('[data-f="amt"]').value) || e.amt;
            e.cat = tr.querySelector('[data-f="cat"]').value.trim() || e.cat;
            e.sub = tr.querySelector('[data-f="sub"]').value.trim() || e.sub;
            e.desc = tr.querySelector('[data-f="desc"]').value.trim() || e.desc;
            e.payer = tr.querySelector('[data-f="payer"]').value.trim();
            editId = null; save(); render(); showToast("ویرایش شد");
          };
          tr.querySelector('[data-act="cancel"]').onclick = () => { editId = null; render(); };
        } else {
          if (view === "table") {
            tr.innerHTML = `<td class="d">${pdate(e.date)}</td>
              <td>${esc(e.cat)}</td>
              <td>${esc(e.sub)}</td>
              <td class="n">${fa(e.amt)}</td>
              <td>${esc(e.payer || "—")}</td>
              <td class="a"><button class="icon-btn" style="width:32px;height:32px;font-size:1rem;border:none;background:transparent" data-id="${e.id}">⋮</button></td>`;
          } else {
            tr.innerHTML = `<td class="d">${pdate(e.date)}</td>
              <td colspan="2">${esc(e.desc)}${e.payer ? `<span class="who">پرداخت‌کننده: ${esc(e.payer)}</span>` : ""}</td>
              <td class="n">${fa(e.amt)}</td>
              <td class="a"><button class="icon-btn" style="width:32px;height:32px;font-size:1rem;border:none;background:transparent" data-id="${e.id}">⋮</button></td>`;
          }
          const btn = tr.querySelector("button");
          if (btn) btn.onclick = ev => {
            ev.stopPropagation();
            menuId = e.id;
            const m = $("menu");
            m.style.display = "block";
            const rect = btn.getBoundingClientRect();
            m.style.top = (rect.bottom + 4) + "px";
            m.style.left = Math.max(8, rect.left - 80) + "px";
          };
        }
        rows.appendChild(tr);
      });
    });
  });

  // Payer summary
  const pg = {};
  list.forEach(e => { const k = e.payer || "نامشخص"; pg[k] = (pg[k] || 0) + e.amt; });
  $("pay").innerHTML = Object.entries(pg).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `<div class="pr"><span>${esc(k)}</span><b>${fa(v)}</b></div>`).join("")
    || `<div class="empty">—</div>`;

  // Stats (always from full data)
  const t = today();
  const weekStart = shift(-((new Date().getDay() + 1) % 7));
  const m = mk(t);
  const allSum = sum(S.entries);
  $("sT").textContent = fa(sum(S.entries.filter(e => e.date === t)));
  $("sW").textContent = fa(sum(S.entries.filter(e => e.date >= weekStart)));
  $("sM").textContent = fa(sum(S.entries.filter(e => mk(e.date) === m)));
  $("sA").textContent = fa(allSum);
}

function ask(msg, txt) {
  return new Promise(res => {
    const d = $("dlg"), t = $("dtx");
    $("dm").textContent = msg;
    t.style.display = txt ? "block" : "none";
    t.value = "";
    d.style.display = "flex";
    const done = v => { d.style.display = "none"; $("dok").onclick = $("dno").onclick = null; res(v); };
    $("dok").onclick = () => done(txt ? t.value : true);
    $("dno").onclick = () => done(txt ? "" : false);
  });
}

// Event listeners
document.addEventListener("click", () => {
  $("menu").style.display = "none";
  $("gmenu").style.display = "none";
});
$("gm").onclick = ev => {
  ev.stopPropagation();
  $("menu").style.display = "none";
  const m = $("gmenu");
  m.style.display = m.style.display === "block" ? "none" : "block";
};
$("mEdit").onclick = () => { editId = menuId; render(); };
$("mDel").onclick = async () => {
  if (await ask("این پرداخت حذف شود؟")) {
    S.entries = S.entries.filter(x => x.id !== menuId);
    save(); render(); showToast("حذف شد");
  }
};
$("add").onclick = () => {
  const v = $("txt").value.trim();
  if (v) { handle(v); $("txt").value = ""; }
};
$("txt").onkeydown = e => { if (e.key === "Enter") $("add").click(); };

$("clr").onclick = async () => {
  if (await ask("همه پرداخت‌ها پاک شود؟ این کار برگشت‌پذیر نیست.")) {
    S = { entries: [], map: {}, view: S.view, theme: S.theme };
    save(); render();
    setHint("همه پاک شد.", "ok");
    showToast("همه پاک شد");
  }
};

const cp = async (t, ok) => {
  try {

    setHint(ok, "ok");
    showToast(ok);

  }
};

);

  if (!t) return;
  try {

  }

// ==================== Speech engines (Online + Offline Vosk) ====================
const MODEL_URL = "https://ccoreilly.github.io/vosk-browser/models/vosk-model-small-fa-0.4.tar.gz";
const MODEL_CACHE = "vosk-fa-model-v1";

let voskModel = null;
let voskRecognizer = null;
let voskAudioCtx = null;
let voskStream = null;
let voskProcessor = null;
let isListening = false;
let modelLoading = false;

function updateSpeechStatus() {
  const el = $("speechStatus");
  if (!el) return;
  if (voskModel) {
    el.textContent = "آفلاین آماده";
    el.className = "status-badge offline-ready";
  } else if (modelLoading) {
    el.textContent = "در حال دانلود مدل...";
    el.className = "status-badge downloading";
  } else if (navigator.onLine) {
    el.textContent = "آنلاین";
    el.className = "status-badge online";
  } else {
    el.textContent = "آفلاین (مدل نیاز است)";
    el.className = "status-badge offline-need";
  }
}

async function loadVoskModel(showProgress = true) {
  if (voskModel || modelLoading) return voskModel;
  if (typeof Vosk === "undefined") {
    setHint("کتابخانه Vosk بارگذاری نشد. اینترنت را چک کنید.", "err");
    return null;
  }
  modelLoading = true;
  updateSpeechStatus();
  if (showProgress) {
    $("progressWrap").classList.add("show");
    $("progressBar").style.width = "5%";
    setHint("در حال دانلود مدل فارسی آفلاین (~۴۹ مگ)... لطفاً صبر کنید", "");
  }
  try {
    // Try cache first
    let modelBlobUrl = null;
    if ("caches" in window) {
      const cache = await caches.open(MODEL_CACHE);
      let res = await cache.match(MODEL_URL);
      if (!res) {
        // Download with progress
        const response = await fetch(MODEL_URL);
        if (!response.ok) throw new Error("download failed");
        const contentLength = +response.headers.get("Content-Length") || 50 * 1024 * 1024;
        const reader = response.body.getReader();
        let received = 0;
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          const pct = Math.min(95, Math.round((received / contentLength) * 100));
          $("progressBar").style.width = pct + "%";
          setHint("دانلود مدل: " + pct + "% (" + Math.round(received / 1024 / 1024) + " مگ)", "");
        }
        const blob = new Blob(chunks);
        await cache.put(MODEL_URL, new Response(blob, { headers: { "Content-Type": "application/gzip" } }));
        modelBlobUrl = URL.createObjectURL(blob);
      } else {
        $("progressBar").style.width = "60%";
        setHint("مدل از حافظه بارگذاری می‌شود...", "");
        const blob = await res.blob();
        modelBlobUrl = URL.createObjectURL(blob);
      }
    } else {
      modelBlobUrl = MODEL_URL;
    }

    $("progressBar").style.width = "80%";
    setHint("در حال آماده‌سازی موتور تشخیص صدا...", "");
    voskModel = await Vosk.createModel(modelBlobUrl || MODEL_URL);
    $("progressBar").style.width = "100%";
    setHint("مدل آفلاین آماده شد! ✓ حالا می‌توانید بدون اینترنت صحبت کنید.", "ok");
    showToast("مدل آفلاین آماده شد");
    setTimeout(() => {
      $("progressWrap").classList.remove("show");
      $("progressBar").style.width = "0%";
    }, 1500);
    modelLoading = false;
    updateSpeechStatus();
    return voskModel;
  } catch (err) {
    console.error(err);
    modelLoading = false;
    updateSpeechStatus();
    $("progressWrap").classList.remove("show");
    setHint("خطا در دانلود/بارگذاری مدل: " + (err.message || err), "err");
    showToast("خطا در آماده‌سازی مدل آفلاین");
    return null;
  }
}

function stopVoskListening() {
  isListening = false;
  $("mic").classList.remove("on");
  try {
    if (voskProcessor) {
      voskProcessor.disconnect();
      voskProcessor.onaudioprocess = null;
      voskProcessor = null;
    }
    if (voskStream) {
      voskStream.getTracks().forEach(t => t.stop());
      voskStream = null;
    }
    if (voskAudioCtx && voskAudioCtx.state !== "closed") {
      voskAudioCtx.close().catch(() => {});
      voskAudioCtx = null;
    }
    if (voskRecognizer) {
      try { voskRecognizer.remove(); } catch (e) {}
      voskRecognizer = null;
    }
  } catch (e) { console.warn(e); }
}

async function startVoskListening() {
  if (!voskModel) {
    const m = await loadVoskModel(true);
    if (!m) return;
  }
  stopVoskListening();
  try {
    voskStream = await navigator.mediaDevices.getUserMedia({
      video: false,
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        channelCount: 1,
        sampleRate: 16000
      }
    });
    voskAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    if (voskAudioCtx.state === "suspended") await voskAudioCtx.resume();

    voskRecognizer = new voskModel.KaldiRecognizer(voskAudioCtx.sampleRate || 16000);
    voskRecognizer.on("result", (message) => {
      const text = (message.result && message.result.text) ? message.result.text.trim() : "";
      if (text) {
        setHint("آفلاین: " + text, "ok");
        handle(text);
      }
    });
    voskRecognizer.on("partialresult", (message) => {
      const p = (message.result && message.result.partial) ? message.result.partial.trim() : "";
      if (p) setHint("در حال تشخیص (آفلاین): " + p, "");
    });

    const source = voskAudioCtx.createMediaStreamSource(voskStream);
    voskProcessor = voskAudioCtx.createScriptProcessor(4096, 1, 1);
    voskProcessor.onaudioprocess = (event) => {
      try {
        if (voskRecognizer && isListening) {
          voskRecognizer.acceptWaveform(event.inputBuffer);
        }
      } catch (e) { console.warn("acceptWaveform", e); }
    };
    source.connect(voskProcessor);
    voskProcessor.connect(voskAudioCtx.destination);

    isListening = true;
    $("mic").classList.add("on");
    setHint("در حال گوش دادن (آفلاین)... صحبت کنید", "");
  } catch (err) {
    console.error(err);
    stopVoskListening();
    setHint("خطای میکروفون یا دسترسی: " + (err.message || err), "err");
  }
}

// Online Web Speech API
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let webSpeechRec = null;
if (SR) {
  webSpeechRec = new SR();
  webSpeechRec.lang = "fa-IR";
  webSpeechRec.interimResults = false;
  webSpeechRec.continuous = false;
  webSpeechRec.onresult = ev => {
    const t = ev.results[0][0].transcript;
    setHint("آنلاین: " + t, "");
    handle(t);
  };
  webSpeechRec.onend = () => {
    isListening = false;
    $("mic").classList.remove("on");
  };
  webSpeechRec.onerror = ev => {
    isListening = false;
    $("mic").classList.remove("on");
    if (ev.error !== "aborted" && ev.error !== "no-speech") {
      setHint("خطای تشخیص آنلاین: " + ev.error, "err");
    }
  };
}

$("mic").onclick = async () => {
  if (isListening) {
    // Stop
    if (voskRecognizer) stopVoskListening();
    else if (webSpeechRec) {
      try { webSpeechRec.stop(); } catch (e) {}
      isListening = false;
      $("mic").classList.remove("on");
    }
    setHint("توقف ضبط", "");
    return;
  }

  // Prefer offline if model ready, or if offline
  const preferOffline = !!voskModel || !navigator.onLine;

  if (preferOffline) {
    if (!voskModel) {
      // Need to download first
      const ok = await ask("برای تشخیص صدای آفلاین باید مدل فارسی (~۴۹ مگابایت) یک‌بار دانلود شود. ادامه می‌دهید؟");
      if (!ok) return;
      await loadVoskModel(true);
      if (!voskModel) return;
    }
    await startVoskListening();
  } else if (webSpeechRec) {
    try {
      webSpeechRec.start();
      isListening = true;
      $("mic").classList.add("on");
      setHint("در حال گوش دادن (آنلاین)...", "");
    } catch (e) {
      setHint("خطا در شروع تشخیص آنلاین", "err");
    }
  } else {
    setHint("مرورگر از تشخیص صدا پشتیبانی نمی‌کند. از تایپ استفاده کنید یا مدل آفلاین را دانلود کنید.", "err");
  }
};

// Menu: prepare offline model
$("offlineBtn").onclick = async (ev) => {
  ev.stopPropagation();
  $("gmenu").style.display = "none";
  if (voskModel) {
    setHint("مدل آفلاین از قبل آماده است.", "ok");
    showToast("مدل آفلاین آماده است");
    return;
  }
  const ok = await ask("مدل فارسی تشخیص صدا (~۴۹ مگابایت) دانلود شود؟ بعد از دانلود کاملاً آفلاین کار می‌کند.");
  if (ok) await loadVoskModel(true);
};

// Status on load + online/offline events
updateSpeechStatus();
window.addEventListener("online", updateSpeechStatus);
window.addEventListener("offline", updateSpeechStatus);

// Try to restore model from cache silently on load (if online or already cached)
(async () => {
  if ("caches" in window) {
    try {
      const cache = await caches.open(MODEL_CACHE);
      const res = await cache.match(MODEL_URL);
      if (res && typeof Vosk !== "undefined") {
        setHint("در حال بارگذاری مدل آفلاین از حافظه...", "");
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        voskModel = await Vosk.createModel(url);
        updateSpeechStatus();
        setHint("مدل آفلاین از حافظه بارگذاری شد ✓", "ok");
        setTimeout(() => setHint("بگو: «دستمزد گچکار ۲۰۰ هزار تومان پرداخت شده توسط مهدی»", ""), 2500);
      }
    } catch (e) {
      console.warn("silent model load failed", e);
    }
  }
})();
