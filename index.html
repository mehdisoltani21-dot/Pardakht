<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر پرداخت‌ها</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f6e56">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f1;--fg:#1c1c1a;--mut:#74746d;--card:#fff;--line:#e6e5de;--ac:#0f6e56;--acs:#e3f2ed;--red:#b3261e;--sh:0 1px 3px rgba(0,0,0,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121215;--fg:#ececea;--mut:#9a9a94;--card:#1d1d21;--line:#2f2f35;--ac:#3ecf9e;--acs:#173a2f;--red:#f2877f;--sh:none}}
:root[data-theme="dark"]{--bg:#121215;--fg:#ececea;--mut:#9a9a94;--card:#1d1d21;--line:#2f2f35;--ac:#3ecf9e;--acs:#173a2f;--red:#f2877f;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,sans-serif;padding:16px 16px 40px;max-width:920px;margin-inline:auto}
h1{font-size:19px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;outline:none;box-sizing:border-box}
input:focus{border-color:var(--ac)}
button{font:inherit;font-weight:500;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button:not(.g):not(.ic){color:#0b1f18}}
button.g{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.sm{padding:6px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.st span{display:block;color:var(--mut);font-size:12px}
.st b{font-size:15px;font-variant-numeric:tabular-nums}
.st.m{background:var(--acs)}.st.m b{color:var(--ac)}
.sec{font-size:13px;color:var(--mut);font-weight:500}
.scroll{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
td.n{direction:ltr;text-align:left;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
td.d{color:var(--mut);white-space:nowrap;font-size:13px}
td.a{width:1%;white-space:nowrap;text-align:left}
.g1 td{background:var(--acs);cursor:pointer;padding:12px 10px;font-weight:700;border-bottom:0}
.g2 td{background:var(--bg);cursor:pointer;padding:9px 10px 9px 10px;color:var(--fg)}
.g2 b{font-weight:500;margin-inline-start:14px}
.cnt{color:var(--mut);font-size:12px;font-weight:400;margin-inline-start:8px}
.tt{float:left;direction:ltr;font-variant-numeric:tabular-nums;font-weight:700}
.g1 .tt{color:var(--ac)}
.chev{color:var(--mut);display:inline-block;width:14px}
.ic{background:transparent;color:var(--mut);font-size:20px;line-height:1;padding:4px 10px;border-radius:8px}
.ef{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ef label{font-size:12px;color:var(--mut);display:block}
.ef input{width:100%}
.ef .w{grid-column:1/-1}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.dbox{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:360px}
#dm{margin-bottom:12px;font-size:15px}
#dtx{width:100%;box-sizing:border-box;margin-bottom:12px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;display:none}
#gmenu{position:fixed;display:none;top:calc(env(safe-area-inset-top,0px) + 56px);left:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:170px;padding:4px;z-index:9}
#gmenu button{display:block;width:100%;text-align:right;background:transparent;color:var(--fg);padding:10px 12px;border-radius:8px}
#gmenu button.del{color:var(--red)}
#menu{position:fixed;display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:120px;padding:4px;z-index:9}
#menu button{display:block;width:100%;text-align:right;background:transparent;color:var(--fg);padding:9px 12px;border-radius:8px}
#menu button.del{color:var(--red)}
body.cp table{font-size:12px}body.cp td{padding:4px 6px}body.cp th{padding:5px 6px;font-size:11px}body.cp .g1 td{padding:8px}body.cp .g2 td{padding:5px 8px}body.cp td.n small{display:none}body.cp .who{font-size:11px;margin-top:0}body.cp .ic{padding:0 8px;font-size:18px}body.cp .st{padding:8px 10px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fm select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.fm button{grid-column:1/-1}
#qk summary{color:var(--mut);font-size:13px;cursor:pointer;margin-bottom:8px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs .ic{font-size:13px;padding:10px 4px;font-weight:500;color:var(--mut);border-radius:9px}
.tabs .ic.on{background:var(--ac);color:var(--bg)}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.fl select,.fl input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.fl .w{grid-column:1/-1}
#fdr{display:none;grid-column:1/-1;gap:8px}#fdr input{flex:1}
#fsum{font-size:13px;color:var(--mut)}
#fw{grid-column:1/-1;font-size:13px;color:var(--ac);min-height:19px;margin-top:-2px}
.fm .w{grid-column:1/-1}
.ck{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.ck.od{border-color:var(--red);background:rgba(179,38,30,.08)}
.ck.sn{border-color:#d19a1e;background:rgba(209,154,30,.1)}
.ck.dn{opacity:.55}
.ckb{flex:1;min-width:0}
.ckt{display:flex;justify-content:space-between;gap:8px}
.ckt span{direction:ltr;font-weight:700;font-variant-numeric:tabular-nums}
.cks{color:var(--mut);font-size:12.5px;margin-top:2px}
#alert{display:none;border:1px solid var(--red);background:rgba(179,38,30,.1);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13.5px;cursor:pointer}
#alert b{color:var(--red);display:block;margin-bottom:2px}
.lb{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
.fm div>input,.fm div>select{width:100%;box-sizing:border-box}
#cw{grid-column:1/-1;font-size:13px;color:var(--ac);min-height:19px;margin-top:-2px}
#cmenu{position:fixed;display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:190px;padding:4px;z-index:9}
#cmenu button{display:block;width:100%;text-align:right;background:transparent;color:var(--fg);padding:9px 12px;border-radius:8px}
#cmenu button.del{color:var(--red)}
.jd{display:flex;gap:4px}
.jd select{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 2px}
#fdr .jd{flex:1}
th{color:var(--mut);font-weight:500;font-size:12px;text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.pr{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}.pr:last-child{border:0}.pr b{direction:ltr;font-variant-numeric:tabular-nums}
.who{display:block;color:var(--mut);font-size:12px;margin-top:3px}
td.n small{font-weight:400;color:var(--mut);font-size:11px}
.empty{color:var(--mut);text-align:center;padding:22px 0;font-size:14px}
#bar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
#bar .in{max-width:920px;margin:auto}
#hint{color:var(--mut);font-size:12.5px;margin-bottom:8px;min-height:17px}
#mic{width:48px;height:48px;border-radius:50%;padding:0;font-size:20px;flex:none}
#mic.on{background:var(--red);animation:p 1s infinite}
@keyframes p{50%{opacity:.6}}
#txt{flex:1;min-width:0}
.bar{display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><h1>دفتر پرداخت‌ها</h1><div class="sub">ثبت صوتی؛ تاریخ و شاخه خودکار</div></div><button class="ic" id="gm" aria-label="گزینه‌ها">⋮</button></div>
<div id="gmenu"><button id="cpb">جدول: حالت معمولی</button><button id="copy">کپی برای اکسل</button><button id="shb">ارسال پشتیبان (اشتراک‌گذاری)</button><button id="bk">پشتیبان (کپی)</button><button id="rs">بازیابی پشتیبان</button><button id="clr" class="del">پاک کردن همه</button></div>

<div class="tabs"><button class="ic" id="t1">ثبت پرداخت</button><button class="ic" id="t2">مشاهده و فیلتر</button><button class="ic" id="t3">چک‌ها</button></div>
<div id="alert"></div>
<div id="pg2"><div class="stats">
  <div class="st"><span>امروز</span><b id="sT">۰</b></div>
  <div class="st"><span>این ماه</span><b id="sM">۰</b></div>
  <div class="st m"><span>جمع کل (تومان)</span><b id="sA">۰</b></div>
</div>

<div class="card">
  <div class="sec">فیلتر</div>
  <div class="fl">
    <select id="fr"><option value="all">همه زمان‌ها</option><option value="today">امروز</option><option value="week">۷ روز اخیر</option><option value="month">این ماه</option><option value="custom">بازهٔ دلخواه</option></select>
    <select id="fpay"></select>
    <select id="fcat"></select>
    <select id="fsub"></select>
    <div id="fdr"><div class="jd" id="f1"></div><div class="jd" id="f2"></div></div>
    <input id="fq" class="w" placeholder="جستجو در شرح و توضیحات">
  </div>
  <div class="row" style="justify-content:space-between"><span id="fsum"></span><button class="g sm" id="frs">پاک کردن فیلترها</button></div>
</div>
<div class="card">
  <div class="row" style="justify-content:space-between"><div class="sec">پرداخت‌ها</div><span class="row"><button class="g sm" id="vT">جدول</button><button class="g sm" id="vG">درختی</button></span></div>
  <div class="scroll"><table><thead id="th"></thead><tbody id="rows"></tbody></table></div>
  <div id="empty" class="empty" style="display:none">هنوز پرداختی ثبت نشده است.</div>
</div>

<div class="card"><div class="sec">جمع به تفکیک پرداخت‌کننده</div><div id="pay"></div></div></div>
<div id="pg3" style="display:none">
<div class="card">
  <div class="sec">ثبت چک جدید</div>
  <div class="fm" style="margin-top:8px">
    <input id="ct" class="w" placeholder="پرداخت به (نام گیرنده چک)" autocomplete="off">
    <input id="ca" class="w" inputmode="numeric" placeholder="مبلغ چک (تومان)" autocomplete="off">
    <div id="cw"></div>
    <div><label class="lb">تاریخ وصول</label><div class="jd" id="cd"></div></div>
    <div><label class="lb">چک توسط (صادرکننده)</label><select id="cb"><option>سلطانی</option><option>اکبری</option></select></div>
    <input id="cn" class="w" placeholder="توضیحات یا شماره چک (اختیاری)" autocomplete="off">
    <button id="cadd">ثبت چک</button>
    <button id="ccan" class="g" style="display:none">لغو ویرایش</button>
  </div>
  <div id="chint" class="cks"></div>
</div>
<div class="card">
  <div class="sec">چک‌ها</div>
  <div class="fl"><select id="cflt"><option value="pending">در انتظار وصول</option><option value="all">همه</option><option value="done">وصول‌شده</option></select>
  <select id="cdays"><option value="1">هشدار: ۱ روز قبل</option><option value="2">هشدار: ۲ روز قبل</option><option value="3">هشدار: ۳ روز قبل</option><option value="5">هشدار: ۵ روز قبل</option><option value="7">هشدار: ۷ روز قبل</option><option value="10">هشدار: ۱۰ روز قبل</option></select></div>
  <div id="cstat" class="cks"></div>
  <div id="clist"></div>
  <button class="g sm" id="cnf" style="margin-top:10px">فعال‌سازی اعلان موقع باز شدن برنامه</button>
</div>
</div>



<div id="dlg"><div class="dbox"><div id="dm"></div><textarea id="dtx" rows="5"></textarea><div class="row"><button id="dok">تأیید</button><button class="g" id="dno">لغو</button></div></div></div>
<div id="cmenu"><button id="cDone">✓ وصول شد</button><button id="cIcs">📅 یادآور در تقویم گوشی</button><button id="cEd">✎ ویرایش</button><button id="cDel" class="del">🗑 حذف</button></div>
<div id="menu"><button id="mEdit">✎ ویرایش</button><button id="mDel" class="del">🗑 حذف</button></div>

<div id="bar"><div class="in">
  <div id="hint">شاخه و زیرشاخه را بنویس یا از پیشنهادها انتخاب کن</div>
  <div class="fm">
    <input id="fc" list="dlc" placeholder="شاخه (مثلاً دستمزد)" autocomplete="off">
    <input id="fs" list="dls" placeholder="زیرشاخه (مثلاً گچکار)" autocomplete="off">
    <input id="fa" inputmode="numeric" placeholder="مبلغ (تومان)" autocomplete="off">
    <select id="fp"><option>سلطانی</option><option>اکبری</option></select>
    <div id="fw"></div>
    <input id="fn" class="w" placeholder="توضیحات (اختیاری)" autocomplete="off">
    <button id="fadd">ثبت</button>
  </div>
  <datalist id="dlc"></datalist><datalist id="dls"></datalist><datalist id="dlp"><option value="سلطانی"><option value="اکبری"></datalist>
  <details id="qk"><summary>ثبت سریع با صدا یا متن</summary>
  <div class="bar">
    <button id="mic" title="ضبط صدا">🎤</button>
    <input id="txt" placeholder="پرداخت را بگو یا تایپ کن">
    <button id="add">ثبت</button>
  </div></details>
  <div id="rec"></div>
</div></div>

<script>
alert("در حال بازگردانی... لطفاً صفحه را رفرش نکنید. نسخه کامل به زودی برمی‌گردد.");
</script>
</body>
</html>
