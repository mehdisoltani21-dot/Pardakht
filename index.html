<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر پرداخت‌ها</title>
<meta name="theme-color" content="#1a1d1c">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1d1c;--fg:#e8ecea;--mut:#8b9691;--card:#232826;--line:#2f3532;--ac:#3dba94;--acs:#1e332c;--red:#e57373}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,sans-serif;padding:16px;max-width:920px;margin-inline:auto}
h1{font-size:20px;color:var(--ac);margin:0 0 4px}
.sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;border-radius:10px;padding:10px 12px;border:1px solid var(--line);background:#151817;color:var(--fg)}
button{background:var(--ac);color:#0b1f18;border:0;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--fg);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.st span{display:block;color:var(--mut);font-size:12px}
.st b{font-size:15px}
.st.m{background:var(--acs)}.st.m b{color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:right}
td.n{direction:ltr;text-align:left;font-weight:700}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fm .w{grid-column:1/-1}
.banner{background:var(--acs);border:1px solid var(--ac);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--ac)}
.empty{color:var(--mut);text-align:center;padding:20px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.dbox{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:400px;border:1px solid var(--line)}
#dtx{width:100%;min-height:120px;margin:10px 0;font:inherit;color:var(--fg);background:#151817;border:1px solid var(--line);border-radius:10px;padding:8px}
</style>
</head>
<body>
<h1>دفتر پرداخت‌ها</h1>
<div class="sub">داده روی همین دستگاه · کلید pardakht-v1</div>
<div class="banner">از منوی پایین می‌توانی پشتیبان را بازیابی کنی. داده پاک نمی‌شود.</div>
<div class="stats">
  <div class="st"><span>امروز</span><b id="sT">۰</b></div>
  <div class="st"><span>این ماه</span><b id="sM">۰</b></div>
  <div class="st m"><span>جمع کل</span><b id="sA">۰</b></div>
</div>
<div class="card">
  <div class="fm">
    <input id="fc" placeholder="شاخه">
    <input id="fs" placeholder="زیرشاخه">
    <input id="fa" inputmode="numeric" placeholder="مبلغ (تومان)">
    <select id="fp"><option>سلطانی</option><option>اکبری</option></select>
    <input id="fn" class="w" placeholder="توضیحات (اختیاری)">
    <button id="fadd" class="w">ثبت</button>
  </div>
</div>
<div class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><b>پرداخت‌ها</b>
    <span class="row">
      <button class="g" id="bk">کپی پشتیبان</button>
      <button class="g" id="rs">بازیابی پشتیبان</button>
    </span>
  </div>
  <div id="list"></div>
  <div id="empty" class="empty">هنوز پرداختی نیست.</div>
</div>
<div id="dlg"><div class="dbox"><div id="dm">پشتیبان را اینجا بچسبان</div><textarea id="dtx"></textarea><div class="row"><button id="dok">تأیید</button><button class="g" id="dno">لغو</button></div></div></div>
<script>
const KEY="pardakht-v1";
let S={entries:[],map:{},cheques:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
S.entries=S.entries||[];S.cheques=S.cheques||[];S.map=S.map||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const fa=n=>Number(n).toLocaleString("fa-IR");
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const pdate=d=>new Date(d+"T12:00:00").toLocaleDateString("fa-IR-u-ca-persian");
function render(){
  const t=today();let sT=0,sM=0,sA=0;const ym=t.slice(0,7);
  S.entries.forEach(e=>{sA+=(+e.amt||0);if(e.date===t)sT+=(+e.amt||0);if((e.date||"").slice(0,7)===ym)sM+=(+e.amt||0)});
  $("sT").textContent=fa(sT);$("sM").textContent=fa(sM);$("sA").textContent=fa(sA);
  const list=$("list");list.innerHTML="";
  if(!S.entries.length){$("empty").style.display="block";return}
  $("empty").style.display="none";
  const tb=document.createElement("table");
  tb.innerHTML="<thead><tr><th>تاریخ</th><th>شاخه</th><th>مبلغ</th><th></th></tr></thead>";
  const body=document.createElement("tbody");
  S.entries.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).forEach(e=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${pdate(e.date)}</td><td>${e.cat||""} / ${e.sub||""}</td><td class="n">${fa(e.amt)}</td><td><button class="g">حذف</button></td>`;
    tr.querySelector("button").onclick=()=>{if(confirm("حذف شود؟")){S.entries=S.entries.filter(x=>x.id!==e.id);save();render()}};
    body.appendChild(tr);
  });
  tb.appendChild(body);list.appendChild(tb);
}
$("fadd").onclick=()=>{
  const amt=parseFloat(String($("fa").value).replace(/[^\d.]/g,""));
  if(!amt){alert("مبلغ را وارد کنید");return}
  S.entries.unshift({id:Date.now()+"-"+Math.random().toString(36).slice(2,6),date:today(),cat:$("fc").value.trim()||"عمومی",sub:$("fs").value.trim()||"عمومی",desc:"",amt,payer:$("fp").value,note:$("fn").value.trim()});
  $("fa").value="";$("fn").value="";save();render();
};
$("bk").onclick=async()=>{
  const t=JSON.stringify(S);
  try{await navigator.clipboard.writeText(t);alert("پشتیبان کپی شد")}catch(e){prompt("کپی کنید:",t)}
};
$("rs").onclick=()=>{$("dlg").style.display="flex";$("dtx").value=""};
$("dno").onclick=()=>{$("dlg").style.display="none"};
$("dok").onclick=()=>{
  try{
    const o=JSON.parse($("dtx").value);
    if(!o||!Array.isArray(o.entries)){alert("فرمت پشتیبان نادرست است");return}
    S=o;S.entries=S.entries||[];S.cheques=S.cheques||[];S.map=S.map||{};
    save();render();$("dlg").style.display="none";alert("بازیابی شد: "+S.entries.length+" پرداخت");
  }catch(e){alert("JSON نامعتبر است")}
};
render();
</script>
</body>
</html>
