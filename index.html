<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتر پرداخت‌ها</title>
<style>
body{margin:0;background:#0a0a0a;color:#f5f5f5;font-family:Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.dbox{background:#1a1a1a;border-radius:24px;padding:28px 22px;width:100%;max-width:340px;border:1px solid #3d3010;text-align:center}
input{width:100%;padding:14px;border-radius:14px;border:1.5px solid #2e2e2e;background:#111;color:#f5f5f5;margin:12px 0;font:inherit;box-sizing:border-box}
button{background:linear-gradient(135deg,#e8a317,#f5c542);color:#1a1200;border:0;font-weight:700;cursor:pointer;width:100%;padding:14px;border-radius:14px;font-size:15px}
#app{display:none;width:100%;max-width:430px;padding:20px}
.mbtn{display:block;width:100%;padding:16px;margin:10px 0;background:#1a1a1a;border:1px solid #2e2e2e;border-radius:16px;color:#f5f5f5;font:inherit;cursor:pointer;text-align:right}
</style>
</head>
<body>
<div id="login" class="dbox">
<div style="font-size:28px;margin-bottom:12px">💰</div>
<div style="font-weight:700;font-size:20px;color:#e8a317">دفتر پرداخت‌ها</div>
<div style="font-size:13px;color:#a3a3a3;margin:6px 0 12px">رمز میهمان یا مدیر</div>
<input id="lpw" type="password" placeholder="رمز عبور">
<div id="lerr" style="color:#f87171;font-size:13px;min-height:18px"></div>
<button id="lgo">ورود</button>
</div>
<div id="app">
<h1>منوی اصلی <span id="roleBadge"></span></h1>
<button class="mbtn" onclick="alert('ثبت پرداخت - در حال تکمیل')">＋ ثبت پرداخت جدید</button>
<button class="mbtn" onclick="alert('ثبت چک - در حال تکمیل')">📋 ثبت چک جدید</button>
<button class="mbtn" onclick="alert('لیست - در حال تکمیل')">✓ لیست پرداخت‌ها</button>
<button class="mbtn" onclick="location.reload()">خروج</button>
</div>
<script>
const PASS_GUEST="M1406",PASS_ADMIN="M136810";
document.getElementById("lgo").onclick=function(){
  const p=document.getElementById("lpw").value;
  if(p===PASS_ADMIN||p===PASS_GUEST){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("roleBadge").textContent=p===PASS_ADMIN?"مدیر":"میهمان";
  }else{
    document.getElementById("lerr").textContent="رمز اشتباه";
  }
};
document.getElementById("lpw").onkeydown=function(e){if(e.key==="Enter")document.getElementById("lgo").click()};
</script>
</body>
</html>
